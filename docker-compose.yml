services:
  db:
    image: postgres:16-alpine
    container_name: secmon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secmon}
      POSTGRES_USER: ${POSTGRES_USER:-secmon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secmon} -d ${POSTGRES_DB:-secmon}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: secmon-api:dev
    container_name: secmon-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-secmon}
      POSTGRES_USER: ${POSTGRES_USER:-secmon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      FAILED_LOGIN_THRESHOLD: ${FAILED_LOGIN_THRESHOLD:-5}
      FAILED_LOGIN_WINDOW_SEC: ${FAILED_LOGIN_WINDOW_SEC:-300}
      PORTSCAN_DISTINCT_PORTS: ${PORTSCAN_DISTINCT_PORTS:-15}
      PORTSCAN_WINDOW_SEC: ${PORTSCAN_WINDOW_SEC:-60}
      SCAN_ALLOWED_CIDRS: ${SCAN_ALLOWED_CIDRS:-127.0.0.1/32,10.0.0.0/8,192.168.0.0/16}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  watcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: secmon-api:dev
    container_name: secmon-watcher
    restart: unless-stopped
    # The watcher reads /var/log/auth.log which on Ubuntu is root:adm 640.
    # The image's non-root user cannot open it, so this one service runs as
    # root. The API service (above) stays unprivileged.
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-secmon}
      POSTGRES_USER: ${POSTGRES_USER:-secmon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FAILED_LOGIN_THRESHOLD: ${FAILED_LOGIN_THRESHOLD:-5}
      FAILED_LOGIN_WINDOW_SEC: ${FAILED_LOGIN_WINDOW_SEC:-300}
      PORTSCAN_DISTINCT_PORTS: ${PORTSCAN_DISTINCT_PORTS:-15}
      PORTSCAN_WINDOW_SEC: ${PORTSCAN_WINDOW_SEC:-60}
      SCAN_ALLOWED_CIDRS: ${SCAN_ALLOWED_CIDRS:-127.0.0.1/32,10.0.0.0/8,192.168.0.0/16}
      WATCHER_STATE_DIR: /state
    volumes:
      - watcher_state:/state
      - /var/log:/var/log:ro
    # If your host lacks /var/log/auth.log, the watcher stays up and retries.
    command: ["python", "-m", "app.watcher", "--source", "auth", "--path", "/var/log/auth.log", "--interval", "3"]

  watcher-ufw:
    build:
      context: .
      dockerfile: Dockerfile
    image: secmon-api:dev
    container_name: secmon-watcher-ufw
    restart: unless-stopped
    # Same rationale as the auth watcher: /var/log/kern.log is root-readable only.
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-secmon}
      POSTGRES_USER: ${POSTGRES_USER:-secmon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FAILED_LOGIN_THRESHOLD: ${FAILED_LOGIN_THRESHOLD:-5}
      FAILED_LOGIN_WINDOW_SEC: ${FAILED_LOGIN_WINDOW_SEC:-300}
      PORTSCAN_DISTINCT_PORTS: ${PORTSCAN_DISTINCT_PORTS:-15}
      PORTSCAN_WINDOW_SEC: ${PORTSCAN_WINDOW_SEC:-60}
      SCAN_ALLOWED_CIDRS: ${SCAN_ALLOWED_CIDRS:-127.0.0.1/32,10.0.0.0/8,192.168.0.0/16}
      WATCHER_STATE_DIR: /state
    volumes:
      - watcher_ufw_state:/state
      - /var/log:/var/log:ro
    # Switch --path to /var/log/ufw.log if your host has a dedicated UFW log.
    command: ["python", "-m", "app.watcher", "--source", "ufw", "--path", "/var/log/kern.log", "--interval", "3"]

volumes:
  pgdata:
  watcher_ufw_state:
  watcher_state:
