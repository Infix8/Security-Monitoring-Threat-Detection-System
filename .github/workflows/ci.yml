name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + migration smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: secmon
          POSTGRES_USER: secmon
          POSTGRES_PASSWORD: secmon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secmon -d secmon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: ci
      LOG_LEVEL: INFO
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: secmon
      POSTGRES_USER: secmon
      POSTGRES_PASSWORD: secmon_test
      FAILED_LOGIN_THRESHOLD: "5"
      FAILED_LOGIN_WINDOW_SEC: "300"
      PORTSCAN_DISTINCT_PORTS: "15"
      PORTSCAN_WINDOW_SEC: "60"
      SCAN_ALLOWED_CIDRS: "127.0.0.1/32,10.0.0.0/8,192.168.0.0/16"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Apply DB migrations
        run: alembic upgrade head

      - name: Run test suite
        run: pytest -q tests/ --cov=app --cov-report=term-missing --cov-report=xml

      - name: Integration smoke — ingest sample, prove idempotency
        run: python scripts/ingest_sample.py

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
